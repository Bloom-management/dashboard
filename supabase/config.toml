# Local-only profile generated against Supabase CLI 2.117.0. No hosted project ref.
project_id = "bloom-backend-local"
[api]
enabled = true
port = 55441
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 55442
shadow_port = 55443
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
sql_paths = []
[realtime]
enabled = false
[studio]
enabled = false
[inbucket]
enabled = false
[storage]
enabled = true
file_size_limit = "10MiB"
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
enable_signup = false
[auth.third_party.clerk]
# Supplied privately through npm run db:start and ignored .env.local.
enabled = true
domain = "env(CLERK_ISSUER_DOMAIN)"
[edge_runtime]
enabled = false
[analytics]
enabled = false
